<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey of Mohamed - Interactive 3D Storyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #story-ui {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: none;
            box-sizing: border-box;
            padding: 10px 22px 13px;
            background: linear-gradient(
                to bottom,
                rgba(5, 8, 17, 0.02) 0%,
                rgba(5, 8, 17, 0.34) 18%,
                rgba(5, 8, 17, 0.78) 58%,
                rgba(5, 8, 17, 0.93) 100%
            );
            backdrop-filter: blur(4px);
            border: 0;
            border-top: 1px solid rgba(255,255,255,0.10);
            border-radius: 0;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.22);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
                "progress progress"
                "info controls";
            align-items: end;
            column-gap: 18px;
            row-gap: 5px;
            z-index: 10;
            pointer-events: none;
        }

        .scene-info {
            grid-area: info;
            min-width: 0;
            padding: 0 0 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        #progress-bar-container {
            grid-area: progress;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #ffcc00);
            transition: width 0.1s linear;
        }

        #scene-title {
            margin: 0;
            font-size: 21px;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }

        #scene-description {
            margin: 2px 0 0;
            font-size: 14px;
            line-height: 1.42;
            color: rgba(245,245,245,0.92);
            min-height: 0;
            max-width: 1100px;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
            overflow: hidden;
        }

        .controls-row {
            grid-area: controls;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            border-top: 0;
            padding-top: 0;
            pointer-events: auto;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 9px 16px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00c6ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 12px #00c6ff;
        }

        #scene-counter {
            font-family: monospace;
            font-size: 13px;
            color: #aaa;
        }
        @media (max-width: 700px) {
            #story-ui {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "progress"
                    "info"
                    "controls";
                row-gap: 4px;
            }

            .controls-row {
                justify-content: space-between;
            }

            #scene-description {
                -webkit-line-clamp: 2;
            }
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="story-ui">
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div class="scene-info">
            <h2 id="scene-title">Loading World...</h2>
            <p id="scene-description">Building scene...</p>
        </div>
        <div class="controls-row">
            <span id="scene-counter">SCENE 1 / 8</span>
            <div class="btn-group">
                <button onclick="prevScene()">◄ Prev</button>
                <button id="autoplay-btn" onclick="toggleAutoPlay()">Autoplay: ON</button>
                <button onclick="nextScene()">Next ►</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const SCENE_DURATION_MS = 15000;
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5ca988);
        scene.fog = new THREE.FogExp2(0x5ca988, 0.008);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.4);
        sun.position.set(40, 80, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const worldGround = new THREE.Mesh(
            new THREE.BoxGeometry(500, 2, 500),
            new THREE.MeshStandardMaterial({ color: 0x5ca988, roughness: 0.9 })
        );
        worldGround.position.y = -1;
        worldGround.receiveShadow = true;
        scene.add(worldGround);

        // Sign Texture Helper
        function createSignTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e5a93b';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#3d2314';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 500, 116);
            ctx.fillStyle = '#222';
            ctx.font = '900 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // Exact Blocky R6 Character Model
        function createRobloxR6(opts = {}, legacyLegColor, legacyHeadColor, legacyAccessoryType) {
            // Preserve Index 10's object-style API while supporting the positional
            // calls used by the transplanted Index 9 scenes.
            if (typeof opts !== 'object' || opts === null) {
                opts = {
                    shirtColor: opts,
                    legColor: legacyLegColor,
                    headColor: legacyHeadColor,
                    accessoryType: legacyAccessoryType
                };
            }
            const {
                shirtColor = 0x5bc0be,
                legColor = 0x2b2d42,
                headColor = 0xf5cd2f,
                accessoryType = null,
                isChild = false,
                weapon = null
            } = opts;

            const avatar = new THREE.Group();
            const scaleFactor = isChild ? 0.7 : 1;
            avatar.scale.set(scaleFactor, scaleFactor, scaleFactor);

            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const headMat = new THREE.MeshStandardMaterial({ color: headColor, roughness: 0.3 });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor, roughness: 0.6 });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.85, roughness: 0.25 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            torso.castShadow = true;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            head.castShadow = true;
            avatar.add(head);

            // Simple Face
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.05), eyeMat);
            eyeL.position.set(-0.3, 4.7, 0.61);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.3;
            avatar.add(eyeL, eyeR);

            if (accessoryType === 'helmet') {
                const helmet = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.65, 1.38), steelMat);
                helmet.position.y = 5.15;
                avatar.add(helmet);
            } else if (accessoryType === 'crown') {
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.65, 0.55, 6), goldMat);
                crown.position.y = 5.3;
                avatar.add(crown);
            } else if (accessoryType === 'oooga_mask') {
                const mask = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                mask.position.set(0, 4.6, 0.65);
                avatar.add(mask);
            }

            // Arms
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);
            avatar.add(rightArmGroup);

            if (weapon === 'sword') {
                const swordGroup = new THREE.Group();
                swordGroup.position.set(0, -1.8, 0.2);
                swordGroup.rotation.x = Math.PI / 2.2;
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.12, 0.25), goldMat);
                hilt.position.y = 0.4;
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.8, 0.3), steelMat);
                blade.position.y = 1.8;
                swordGroup.add(handle, hilt, blade);
                rightArmGroup.add(swordGroup);
            } else if (weapon === 'spear') {
                const spearGroup = new THREE.Group();
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 4), steelMat);
                tip.position.y = 2.5;
                spearGroup.add(shaft, tip);
                spearGroup.position.set(0, -1, 0.5);
                spearGroup.rotation.x = Math.PI / 3;
                rightArmGroup.add(spearGroup);
            } else if (weapon === 'torch') {
                const torchGroup = new THREE.Group();
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                const flame = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
                flame.position.y = 1.4;
                torchGroup.add(handle, flame);
                torchGroup.position.set(0, -1, 0.4);
                torchGroup.rotation.x = Math.PI / 4;
                rightArmGroup.add(torchGroup);
            }

            // Legs
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, torso, head };
            avatar.walkCycleTime = Math.random() * 10;
            return avatar;
        }

        // Cacao Tree as shown in user screenshot
        function createExactCacaoTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(1.2, 1.5, 12, 16),
                new THREE.MeshStandardMaterial({ color: 0x5a3825, roughness: 0.9 })
            );
            trunk.position.y = 6;
            trunk.castShadow = true;

            const crown = new THREE.Mesh(
                new THREE.SphereGeometry(6, 18, 18),
                new THREE.MeshStandardMaterial({ color: 0x1d4d38, roughness: 0.8 })
            );
            crown.position.y = 12;
            crown.castShadow = true;

            tree.add(trunk, crown);
            tree.position.set(x, 0, z);
            return tree;
        }

        function createCacaoCrate(x, z) {
            const crateGroup = new THREE.Group();
            const crate = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 1.2, 1.8),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
            );
            crate.position.y = 0.6;
            crateGroup.add(crate);

            for (let ox = -0.4; ox <= 0.4; ox += 0.8) {
                for (let oz = -0.4; oz <= 0.4; oz += 0.8) {
                    const pod = new THREE.Mesh(
                        new THREE.SphereGeometry(0.35, 8, 8),
                        new THREE.MeshStandardMaterial({ color: 0x6e3619 })
                    );
                    pod.scale.set(0.6, 1.3, 0.6);
                    pod.position.set(ox, 1.4, oz);
                    crateGroup.add(pod);
                }
            }
            crateGroup.position.set(x, 0, z);
            return crateGroup;
        }

        function createWoodenFence(x, z, length) {
            const fence = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x6f4e37 });
            for (let i = 0; i < length; i += 3) {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3, 0.4), mat);
                post.position.set(i, 1.5, 0);
                fence.add(post);
            }
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(length, 0.25, 0.2), mat);
            rail1.position.set(length / 2 - 1.5, 2.2, 0);
            const rail2 = rail1.clone();
            rail2.position.y = 1.0;
            fence.add(rail1, rail2);

            fence.position.set(x, 0, z);
            return fence;
        }

        function animateBotWalking(actor, targetX, targetZ, speed = 0.08) {
            const dx = targetX - actor.position.x;
            const dz = targetZ - actor.position.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.3) {
                actor.rotation.y = Math.atan2(dx, dz);
                actor.position.x += (dx / dist) * speed;
                actor.position.z += (dz / dist) * speed;

                actor.walkCycleTime += 0.15;
                const swing = Math.sin(actor.walkCycleTime) * 0.65;
                actor.rig.leftArmGroup.rotation.x = swing;
                actor.rig.rightArmGroup.rotation.x = -swing;
                actor.rig.leftLegGroup.rotation.x = -swing;
                actor.rig.rightLegGroup.rotation.x = swing;
                return true;
            } else {
                actor.rig.leftArmGroup.rotation.x = 0;
                actor.rig.rightArmGroup.rotation.x = 0;
                actor.rig.leftLegGroup.rotation.x = 0;
                actor.rig.rightLegGroup.rotation.x = 0;
                return false;
            }
        }

        function createArchitecturalCastle() {
            const castle = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5a626e, roughness: 0.85 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b263e, roughness: 0.6 });

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(36, 14, 4), stoneMat);
            frontWall.position.set(0, 7, 0);
            castle.add(frontWall);

            [-18, 18].forEach(tx => {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.5, 20, 12), stoneMat);
                tower.position.set(tx, 10, 0);
                castle.add(tower);

                const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(5, 7, 12), roofMat);
                towerRoof.position.set(tx, 23.5, 0);
                castle.add(towerRoof);
            });

            return castle;
        }

        function createHummusBowl() {
            const bowlGroup = new THREE.Group();
            const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.35, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
            const food = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.3, 0.1, 12), new THREE.MeshStandardMaterial({ color: 0xe9c46a }));
            food.position.y = 0.15;
            bowlGroup.add(bowl, food);
            return bowlGroup;
        }

        function createChocolateBar() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.4 }));
        }

        function createCashBill() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.4), new THREE.MeshBasicMaterial({ color: 0x2a9d8f }));
        }

function createTorch(x, y, z) {
            const torchGroup = new THREE.Group();
            torchGroup.position.set(x, y, z);
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 3.2), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.9 }));
            pole.position.y = 1.6;
            pole.castShadow = true;
            torchGroup.add(pole);

            const light = new THREE.PointLight(0xffaa00, 2.5, 15);
            light.position.y = 3.2;
            torchGroup.add(light);

            const flame = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.65, 0.45), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
            flame.position.y = 3.2;
            torchGroup.add(flame);

            torchGroup.light = light;
            return torchGroup;
        }



        // Extra scene dressing: decorative details added without replacing or removing
        // the original scene objects, animations, or story beats.
        function addSceneDetails(sceneId, props) {
            const add = (obj) => { scene.add(obj); props.push(obj); return obj; };
            const mat = (color, roughness = 0.8, metalness = 0) =>
                new THREE.MeshStandardMaterial({ color, roughness, metalness });

            if (sceneId === 1) {
                // Ground foliage + a few extra cacao pods and baskets.
                for (let i = 0; i < 14; i++) {
                    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.45 + (i % 3) * 0.12, 8, 6), mat(0x40916c, 1));
                    tuft.scale.set(1.3, 0.45, 1.0);
                    tuft.position.set((i % 7) * 6 - 18, 0.35, (i % 2) * 7 + 5);
                    add(tuft);
                }
                for (let i = 0; i < 6; i++) {
                    const pod = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), mat(0x7f4f24, 0.75));
                    pod.scale.set(0.7, 1.25, 0.7);
                    pod.position.set(-16 + i * 6, 0.55, 9 - (i % 2) * 3);
                    add(pod);
                }
            } else if (sceneId === 2) {
                // Courtyard trim: pennants, serving bowls, and low stone edging.
                const bannerMat = mat(0x457b9d, 0.6);
                for (let x = -10; x <= 10; x += 5) {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5), mat(0x5c3d1e));
                    pole.position.set(x, 2.5, 2.5);
                    add(pole);
                    const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.8), bannerMat);
                    flag.position.set(x + 0.55, 3.5, 2.5);
                    flag.rotation.y = Math.PI;
                    add(flag);
                }
                for (let i = -2; i <= 2; i++) {
                    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.3, 0.22, 12), mat(0xd9b44a));
                    bowl.position.set(i * 2.5, 0.15, 4.5);
                    add(bowl);
                }
            } else if (sceneId === 3) {
                // Battlefield dressing: scattered stones, broken shafts, and dust motes.
                for (let i = 0; i < 12; i++) {
                    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45 + (i % 2) * 0.2), mat(0x6b6258));
                    rock.position.set((i % 6) * 5.5 - 14, 0.35, 7 - (i % 3) * 4);
                    add(rock);
                }
                for (let i = 0; i < 8; i++) {
                    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.5), mat(0x5c3d1e));
                    shaft.position.set(-15 + i * 4, 0.8, -9 + (i % 2) * 2);
                    shaft.rotation.z = (i % 2 ? 0.5 : -0.4);
                    add(shaft);
                }
                const dustMat = new THREE.MeshBasicMaterial({ color: 0xe4d8b4, transparent: true, opacity: 0.18 });
                for (let i = 0; i < 18; i++) {
                    const dust = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), dustMat);
                    dust.position.set((i % 9) * 4 - 16, 1 + (i % 4) * 0.9, -2 + (i % 3) * 5);
                    add(dust);
                }
            } else if (sceneId === 4) {
                // Coastal cliff dressing: sea foam, mooring rope, and scattered timber.
                const foamMat = new THREE.MeshBasicMaterial({ color: 0xeafcff, transparent: true, opacity: 0.65 });
                for (let i = 0; i < 12; i++) {
                    const foam = new THREE.Mesh(new THREE.TorusGeometry(0.5 + (i % 3) * 0.25, 0.08, 6, 16), foamMat);
                    foam.rotation.x = Math.PI / 2;
                    foam.position.set(-12 + (i % 6) * 5, 0.22, 8 + (i % 2) * 3);
                    add(foam);
                }
                for (let i = 0; i < 5; i++) {
                    const timber = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.3, 0.45), mat(0x6f4e37));
                    timber.position.set(-27 + i * 4, 0.5, 6 + (i % 2) * 2);
                    timber.rotation.y = i * 0.35;
                    add(timber);
                }
                const rope = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.12, 8, 18), mat(0x8d6e63));
                rope.position.set(-9.5, 1.0, 4.5);
                rope.rotation.x = Math.PI / 2;
                add(rope);
            } else if (sceneId === 5) {
                // Ginga arrival details: desert plants, driftwood, and small tide markers.
                for (let i = 0; i < 7; i++) {
                    const cactus = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 2.5, 8), mat(0x588157));
                    body.position.y = 1.25;
                    cactus.add(body);
                    if (i % 2 === 0) {
                        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 1.1, 8), mat(0x588157));
                        arm.position.set(0.5, 1.2, 0);
                        arm.rotation.z = Math.PI / 2.4;
                        cactus.add(arm);
                    }
                    cactus.position.set(-14 + i * 4.5, 0, 4 + (i % 2) * 2);
                    add(cactus);
                }
                const driftMat = mat(0x7f5539);
                for (let i = 0; i < 5; i++) {
                    const drift = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.35, 0.35), driftMat);
                    drift.position.set(-12 + i * 5, 0.3, 7 - (i % 2) * 3);
                    drift.rotation.z = (i - 2) * 0.12;

                    const shop = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 7), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                    shop.position.set(0, 3.5, -5);

                    const roof = new THREE.Mesh(new THREE.ConeGeometry(13, 5, 4), new THREE.MeshStandardMaterial({ color: 0xb0411b }));
                    roof.position.set(0, 9.5, -5);
                    roof.rotation.y = Math.PI / 4;

                    const counter = new THREE.Mesh(new THREE.BoxGeometry(13, 1.8, 1.4), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                    counter.position.set(0, 0.9, 0.2);

                    const sign = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 0.3), new THREE.MeshStandardMaterial({ color: 0xffd166 }));
                    sign.position.set(0, 6, -1.2);
                    scene.add(shop, roof, counter, sign);
                    props.push(shop, roof, counter, sign);

                    // Jars & Chocolate Displays on counter
                    const jarMat = new THREE.MeshStandardMaterial({ color: 0xffeeaa, transparent: true, opacity: 0.8 });
                    const chocMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.3 });
                    const moneyMat = new THREE.MeshStandardMaterial({ color: 0x2b9348, roughness: 0.5 });

                    for (let j = -5; j <= 5; j += 2) {
                        const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.9), jarMat);
                        jar.position.set(j, 2.2, 0.2);
                        scene.add(jar);
                        props.push(jar);
                    }

                    // Main Sellers: Mohamed & Alizar
                    const mohamed = createRobloxR6(0x2a9d8f, 0x264653);
                    mohamed.position.set(-3, 0, -1);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const choc1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.8), chocMat);
                    choc1.position.set(0, -1.8, 0.5);
                    mohamed.rig.rightArmGroup.add(choc1);

                    const alizar = createRobloxR6(0xf4a261, 0x6b705c);
                    alizar.position.set(3, 0, -1);
                    scene.add(alizar);
                    props.push(alizar);

                    const choc2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.8), chocMat);
                    choc2.position.set(0, -1.8, 0.5);
                    alizar.rig.rightArmGroup.add(choc2);

                    // HUGE CROWD OF CUSTOMERS & VISITORS (PACKED PLAZA)
                    const customerList = [];
                    const customerColors = [0xee9b00, 0xca6702, 0x0a9396, 0x9b5de5, 0xf15bb5, 0x00bbf9, 0x00f5d4];

                    // Customers right at counter buying chocolate
                    for (let c = 0; c < 12; c++) {
                        const color = customerColors[c % customerColors.length];
                        const cust = createRobloxR6(color, 0x111111);
                        
                        // Place customers in lines and groups in front of shop
                        const row = Math.floor(c / 4);
                        const col = (c % 4) - 1.5;
                        cust.position.set(col * 2.8, 0, 2 + row * 3.5);
                        cust.rotation.y = Math.PI + (Math.random() - 0.5) * 0.4;

                        // Give money bills to buying customers
                        const cash = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.35), moneyMat);
                        cash.position.set(0, -1.8, 0.5);
                        cust.rig.rightArmGroup.add(cash);

                        scene.add(cust);
                        customerList.push(cust);
                        props.push(cust);
                    }

                    // Benches with seated/chilling customers in plaza foreground
                    const benchMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1b });
                    [-8, 8].forEach(bx => {
                        const bench = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 1.5), benchMat);
                        bench.position.set(bx, 0.6, 8);
                        scene.add(bench);
                        props.push(bench);

                        const diner = createRobloxR6(0x00bbf9, 0x111111);
                        diner.position.set(bx, 0.2, 8);
                        diner.rig.leftLegGroup.rotation.x = -Math.PI / 2;
                        diner.rig.rightLegGroup.rotation.x = -Math.PI / 2;
                        scene.add(diner);
                        props.push(diner);
                    });

                    let tradeTimer = 0;
                    return {
                        actors: props,
                        update: () => {
                            tradeTimer += 0.04;
                            const tradeAction = Math.sin(tradeTimer);

                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;
                            alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + tradeAction * 0.15;

                            customerList.forEach((cust, idx) => {
                                cust.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 - Math.sin(tradeTimer + idx) * 0.15;
                            });
                        }
                    };
                }
            },
            {
                title: "7. The Threat of Corruption",
                desc: "Corrupt forces attack Mohamed and Alizar, striking them until they fall. Behind them, the A&M Snacks shop catches fire; once they are down, the shop burns and collapses into broken pieces.",
                camPos: [0, 12, 22],
                camLookAt: [0, 3, 0],
                skyColor: 0x1b0000,
                setup: () => {
                    worldGround.material.color.setHex(0x181310);
                    scene.fog.color.setHex(0x1b0000);
                    const props = [];

                    // Scene 6 shop, reused here with a black/charred finish.
                    const shopMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.95 });
                    const roofMat = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.95 });
                    const woodMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.95 });
                    const signMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

                    const shop = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 7), shopMat);
                    shop.position.set(0, 3.5, -5);

                    const roof = new THREE.Mesh(new THREE.ConeGeometry(13, 5, 4), roofMat);
                    roof.position.set(0, 9.5, -5);
                    roof.rotation.y = Math.PI / 4;

                    const counter = new THREE.Mesh(new THREE.BoxGeometry(13, 1.8, 1.4), woodMat);
                    counter.position.set(0, 0.9, 0.2);

                    const sign = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 0.3), signMat);
                    sign.position.set(0, 6, -1.2);

                    scene.add(shop, roof, counter, sign);
                    props.push(shop, roof, counter, sign);

                    // Blackened display jars from the Scene 6 shop.
                    const jarMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
                    const jars = [];
                    for (let j = -5; j <= 5; j += 2) {
                        const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.9), jarMat);
                        jar.position.set(j, 2.2, 0.2);
                        scene.add(jar);
                        jars.push(jar);
                        props.push(jar);
                    }

                    // Fire attached around the same shop silhouette.
                    const flameMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
                    const flameMat2 = new THREE.MeshBasicMaterial({ color: 0xffa500 });
                    const flames = [];
                    const flamePositions = [
                        [-6, 2.8, -0.9], [-3, 5.2, -1.0], [0, 7.2, -1.0],
                        [3.5, 4.2, -1.0], [6, 3.0, -0.9], [-4, 8.2, -5],
                        [1, 9.8, -5], [5, 7.8, -5]
                    ];
                    flamePositions.forEach((pos, idx) => {
                        const flame = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.6 + (idx % 3) * 0.35, 0.45), idx % 2 ? flameMat2 : flameMat);
                        flame.position.set(pos[0], pos[1], pos[2]);
                        scene.add(flame);
                        flames.push(flame);
                        props.push(flame);
                    });

                    const fireLight = new THREE.PointLight(0xff5a00, 7, 42);
                    fireLight.position.set(0, 5, -1);
                    scene.add(fireLight);
                    props.push(fireLight);

                    // Smoke and embers.
                    const smokeMat = new THREE.MeshBasicMaterial({ color: 0x222222, transparent: true, opacity: 0.28 });
                    const smoke = [];
                    for (let i = 0; i < 18; i++) {
                        const puff = new THREE.Mesh(new THREE.SphereGeometry(0.45 + (i % 3) * 0.22, 8, 8), smokeMat);
                        puff.position.set(-6 + (i % 7) * 2, 8 + (i % 5) * 1.1, -5 + (i % 3) * 1.3);
                        scene.add(puff);
                        smoke.push(puff);
                        props.push(puff);
                    }

                    const embers = [];
                    const emberMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
                    for (let i = 0; i < 28; i++) {
                        const ember = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.22), emberMat);
                        ember.position.set((Math.random() - 0.5) * 14, 2 + Math.random() * 10, -5 + (Math.random() - 0.5) * 4);
                        scene.add(ember);
                        embers.push(ember);
                        props.push(ember);
                    }

                    // Mohamed and Alizar.
                    const mohamed = createRobloxR6({ shirtColor: 0x5bc0be, legColor: 0x2b2d42 });
                    mohamed.position.set(-2.5, 0, 1.5);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xe5a93b, legColor: 0x3d2314 });
                    alizar.position.set(2.5, 0, 1.5);
                    scene.add(alizar);
                    props.push(alizar);

                    // Attackers beating them.
                    const attacker1 = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'spear' });
                    attacker1.position.set(-4.5, 0, 1.5);
                    attacker1.rotation.y = Math.PI / 2;

                    const attacker2 = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'spear' });
                    attacker2.position.set(4.5, 0, 1.5);
                    attacker2.rotation.y = -Math.PI / 2;

                    scene.add(attacker1, attacker2);
                    props.push(attacker1, attacker2);

                    // Arsonist keeps the shop burning.
                    const arsonist = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'torch' });
                    arsonist.position.set(0, 0, -1);
                    scene.add(arsonist);
                    props.push(arsonist);

                    // Debris pieces used for the collapse.
                    const debris = [];
                    const debrisMat = new THREE.MeshStandardMaterial({ color: 0x090909, roughness: 1 });
                    for (let i = 0; i < 18; i++) {
                        const piece = new THREE.Mesh(
                            new THREE.BoxGeometry(0.7 + (i % 3) * 0.45, 0.55 + (i % 2) * 0.35, 0.7 + ((i + 1) % 3) * 0.35),
                            debrisMat
                        );
                        piece.position.set(
                            (Math.random() - 0.5) * 11,
                            0.4 + Math.random() * 5,
                            -5 + (Math.random() - 0.5) * 5
                        );
                        piece.rotation.set(Math.random(), Math.random(), Math.random());
                        piece.visible = false;
                        scene.add(piece);
                        debris.push(piece);
                        props.push(piece);
                    }

                    let timer = 0;
                    let hitsCount = 0;
                    let fallen = false;
                    let collapseStarted = false;
                    let collapseT = 0;

                    return {
                        actors: props,
                        update: () => {
                            timer += 0.05;

                            fireLight.intensity = 6 + Math.sin(timer * 18) * 2.5;
                            flames.forEach((flame, idx) => {
                                flame.scale.y = 0.8 + 0.25 * Math.sin(timer * 10 + idx);
                                flame.position.x += Math.sin(timer * 5 + idx) * 0.004;
                            });

                            smoke.forEach((puff, idx) => {
                                puff.position.y += 0.025 + (idx % 3) * 0.006;
                                puff.position.x += Math.sin(timer + idx) * 0.006;
                                if (puff.position.y > 16) puff.position.y = 7;
                            });

                            embers.forEach((p, idx) => {
                                p.position.y += 0.1 + (idx % 3) * 0.02;
                                if (p.position.y > 14) p.position.y = 1.5;
                            });

                            if (!fallen) {
                                attacker1.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.sin(timer * 15) * 0.9;
                                attacker2.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.cos(timer * 15) * 0.9;

                                mohamed.rotation.z = Math.sin(timer * 15) * 0.25;
                                alizar.rotation.z = -Math.sin(timer * 15) * 0.25;

                                hitsCount += 0.05;
                                if (hitsCount > 3.5) fallen = true;
                            } else {
                                if (mohamed.rotation.x > -Math.PI / 2) {
                                    mohamed.rotation.x -= 0.12;
                                    mohamed.position.y = 0.5;
                                }
                                if (alizar.rotation.x > -Math.PI / 2) {
                                    alizar.rotation.x -= 0.12;
                                    alizar.position.y = 0.5;
                                }

                                if (!collapseStarted && hitsCount > 4.6) {
                                    collapseStarted = true;
                                }

                                if (collapseStarted) {
                                    collapseT = Math.min(1, collapseT + 0.02);

                                    shop.position.y = 3.5 - collapseT * 2.8;
                                    shop.rotation.z = collapseT * 0.08;
                                    roof.position.y = 9.5 - collapseT * 4.5;
                                    roof.rotation.z = collapseT * 0.55;
                                    counter.position.y = Math.max(0.35, 0.9 - collapseT * 0.6);
                                    counter.rotation.z = -collapseT * 0.35;
                                    sign.position.y = 6 - collapseT * 3.5;
                                    sign.rotation.z = collapseT * 0.65;

                                    jars.forEach((jar, idx) => {
                                        jar.position.y = Math.max(0.3, 2.2 - collapseT * 1.8);
                                        jar.rotation.z += 0.03 + idx * 0.001;
                                    });

                                    if (collapseT > 0.55) {
                                        debris.forEach((piece, idx) => {
                                            piece.visible = true;
                                            piece.position.y -= 0.025 + (idx % 3) * 0.01;
                                            piece.position.x += Math.sin(timer * 2 + idx) * 0.01;
                                            piece.rotation.x += 0.025;
                                            piece.rotation.z += 0.02;
                                        });
                                    }

                                    if (collapseT >= 1) {
                                        shop.visible = false;
                                        roof.visible = false;
                                        counter.visible = false;
                                        sign.visible = false;
                                        jars.forEach(jar => jar.visible = false);
                                    }
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "8. Becoming a Mirja",
                desc: "Mohamed’s journey ends with him honored as a mirja, a spiritual leader who guides his people with wisdom and compassion. His journey from cacao fields and ancient battles to leadership in Texas becomes a lasting legacy.",
                camPos: [0, 12, 30],
                camLookAt: [0, 3, 0],
                setup: () => {
                    worldGround.material.color.setHex(0x52b788);
                    const props = [];
                    addSceneDetails(8, props);

                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.1 });
                    for (let p = -12; p <= 12; p += 4) {
                        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 14, 16), pillarMat);
                        pillar.position.set(p, 7, -6);
                        pillar.castShadow = true;
                        scene.add(pillar);
                        props.push(pillar);
                    }

                    const podium = new THREE.Mesh(
                        new THREE.CylinderGeometry(5.5, 6.5, 2.4, 20),
                        pillarMat
                    );
                    podium.position.set(0, 1.2, -2);
                    podium.receiveShadow = true;
                    scene.add(podium);
                    props.push(podium);

                    const auraLight = new THREE.PointLight(0xffd700, 5, 30);
                    auraLight.position.set(0, 5, -2);
                    scene.add(auraLight);
                    props.push(auraLight);

                    const sparkles = [];
                    const sparkleMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
                    for (let sp = 0; sp < 40; sp++) {
                        const spark = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), sparkleMat);
                        spark.position.set((Math.random() - 0.5) * 14, Math.random() * 9, -2 + (Math.random() - 0.5) * 8);
                        scene.add(spark);
                        sparkles.push(spark);
                        props.push(spark);
                    }

                    const mohamed = createRobloxR6(0xffffff, 0xffffff, 0xf5cd2f, 'crown');
                    mohamed.position.set(0, 2.4, -2);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Large crowd of bowing followers
                    const followers = [];
                    for (let i = -4; i <= 4; i++) {
                        if (i === 0) continue;
                        const follower = createRobloxR6(0x74c69d, 0x1b4332);
                        follower.position.set(i * 3.2, 0, 4 + (Math.abs(i) % 2) * 2);
                        follower.rotation.y = Math.PI;
                        scene.add(follower);
                        followers.push(follower);
                        props.push(follower);
                    }

                    let time = 0;
                    return {
                        actors: props,
                        update: () => {
                            time += 0.02;
                            auraLight.intensity = 3.5 + Math.sin(time * 3) * 1.5;

                            mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.5;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;

                            sparkles.forEach(sp => {
                                sp.position.y += 0.035;
                                if (sp.position.y > 10) sp.position.y = 1;
                            });

                            followers.forEach((f, idx) => {
                                f.rig.leftArmGroup.rotation.x = -Math.PI / 3 + Math.sin(time + idx) * 0.15;
                            });
                        }
                    };
                }
            }
        ];

        let currentSceneIndex = 0;
        let activeSceneInstance = null;
        let autoPlay = true;
        let sceneStartTime = Date.now();

        function clearCurrentScene() {
            if (activeSceneInstance && activeSceneInstance.actors) {
                activeSceneInstance.actors.forEach(actor => scene.remove(actor));
            }
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const child = scene.children[i];
                if (child !== worldGround && child !== sun && child !== ambientLight) {
                    scene.remove(child);
                }
            }
        }

        function loadScene(index) {
            clearCurrentScene();
            currentSceneIndex = index;
            sceneStartTime = Date.now();

            const data = storyData[index];
            document.getElementById('scene-title').innerText = data.title;
            document.getElementById('scene-description').innerText = data.desc;
            document.getElementById('scene-counter').innerText = `SCENE ${index + 1} / ${storyData.length}`;

            camera.position.set(...data.camPos);
            camera.lookAt(...data.camLookAt);

            activeSceneInstance = data.setup();
        }

        function nextScene() {
            loadScene((currentSceneIndex + 1) % storyData.length);
        }

        function prevScene() {
            loadScene((currentSceneIndex - 1 + storyData.length) % storyData.length);
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('autoplay-btn').innerText = `Autoplay: ${autoPlay ? 'ON' : 'OFF'}`;
            sceneStartTime = Date.now();
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - sceneStartTime;
            if (autoPlay) {
                const progress = Math.min((elapsed / SCENE_DURATION_MS) * 100, 100);
                document.getElementById('progress-bar').style.width = `${progress}%`;

                if (elapsed >= SCENE_DURATION_MS) {
                    nextScene();
                }
            } else {
                document.getElementById('progress-bar').style.width = `0%`;
            }

            if (activeSceneInstance && activeSceneInstance.update) {
                activeSceneInstance.update();
            }

            renderer.render(scene, camera);
        }

        loadScene(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
