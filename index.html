<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey of Mohamed - Interactive 3D Storyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #story-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 950px;
            background: rgba(10, 14, 22, 0.94);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(0, 198, 255, 0.5);
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        #progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #ffcc00);
            transition: width 0.1s linear;
        }

        #scene-title {
            margin: 0;
            font-size: 22px;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }

        #scene-description {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            min-height: 52px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00c6ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 12px #00c6ff;
        }

        #scene-counter {
            font-family: monospace;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="story-ui">
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <h2 id="scene-title">Loading World...</h2>
        <p id="scene-description">Building scene...</p>
        <div class="controls-row">
            <span id="scene-counter">SCENE 1 / 8</span>
            <div class="btn-group">
                <button onclick="prevScene()">◄ Prev</button>
                <button id="autoplay-btn" onclick="toggleAutoPlay()">Autoplay: ON</button>
                <button onclick="nextScene()">Next ►</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const SCENE_DURATION_MS = 15000;
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5ca988);
        scene.fog = new THREE.FogExp2(0x5ca988, 0.008);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.4);
        sun.position.set(40, 80, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const worldGround = new THREE.Mesh(
            new THREE.BoxGeometry(500, 2, 500),
            new THREE.MeshStandardMaterial({ color: 0x5ca988, roughness: 0.9 })
        );
        worldGround.position.y = -1;
        worldGround.receiveShadow = true;
        scene.add(worldGround);

        // Sign Texture Helper
        function createSignTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e5a93b';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#3d2314';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 500, 116);
            ctx.fillStyle = '#222';
            ctx.font = '900 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // Exact Blocky R6 Character Model
        function createRobloxR6(opts = {}) {
            const {
                shirtColor = 0x5bc0be,
                legColor = 0x2b2d42,
                headColor = 0xf5cd2f,
                accessoryType = null,
                isChild = false,
                weapon = null
            } = opts;

            const avatar = new THREE.Group();
            const scaleFactor = isChild ? 0.7 : 1;
            avatar.scale.set(scaleFactor, scaleFactor, scaleFactor);

            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const headMat = new THREE.MeshStandardMaterial({ color: headColor, roughness: 0.3 });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor, roughness: 0.6 });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.85, roughness: 0.25 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            torso.castShadow = true;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            head.castShadow = true;
            avatar.add(head);

            // Simple Face
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.05), eyeMat);
            eyeL.position.set(-0.3, 4.7, 0.61);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.3;
            avatar.add(eyeL, eyeR);

            if (accessoryType === 'helmet') {
                const helmet = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.65, 1.38), steelMat);
                helmet.position.y = 5.15;
                avatar.add(helmet);
            } else if (accessoryType === 'crown') {
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.65, 0.55, 6), goldMat);
                crown.position.y = 5.3;
                avatar.add(crown);
            } else if (accessoryType === 'oooga_mask') {
                const mask = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                mask.position.set(0, 4.6, 0.65);
                avatar.add(mask);
            }

            // Arms
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);
            avatar.add(rightArmGroup);

            if (weapon === 'sword') {
                const swordGroup = new THREE.Group();
                swordGroup.position.set(0, -1.8, 0.2);
                swordGroup.rotation.x = Math.PI / 2.2;
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.12, 0.25), goldMat);
                hilt.position.y = 0.4;
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.8, 0.3), steelMat);
                blade.position.y = 1.8;
                swordGroup.add(handle, hilt, blade);
                rightArmGroup.add(swordGroup);
            } else if (weapon === 'spear') {
                const spearGroup = new THREE.Group();
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 4), steelMat);
                tip.position.y = 2.5;
                spearGroup.add(shaft, tip);
                spearGroup.position.set(0, -1, 0.5);
                spearGroup.rotation.x = Math.PI / 3;
                rightArmGroup.add(spearGroup);
            } else if (weapon === 'torch') {
                const torchGroup = new THREE.Group();
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                const flame = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
                flame.position.y = 1.4;
                torchGroup.add(handle, flame);
                torchGroup.position.set(0, -1, 0.4);
                torchGroup.rotation.x = Math.PI / 4;
                rightArmGroup.add(torchGroup);
            }

            // Legs
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, torso, head };
            avatar.walkCycleTime = Math.random() * 10;
            return avatar;
        }

        // Cacao Tree as shown in user screenshot
        function createExactCacaoTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(1.2, 1.5, 12, 16),
                new THREE.MeshStandardMaterial({ color: 0x5a3825, roughness: 0.9 })
            );
            trunk.position.y = 6;
            trunk.castShadow = true;

            const crown = new THREE.Mesh(
                new THREE.SphereGeometry(6, 18, 18),
                new THREE.MeshStandardMaterial({ color: 0x1d4d38, roughness: 0.8 })
            );
            crown.position.y = 12;
            crown.castShadow = true;

            tree.add(trunk, crown);
            tree.position.set(x, 0, z);
            return tree;
        }

        function createCacaoCrate(x, z) {
            const crateGroup = new THREE.Group();
            const crate = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 1.2, 1.8),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
            );
            crate.position.y = 0.6;
            crateGroup.add(crate);

            for (let ox = -0.4; ox <= 0.4; ox += 0.8) {
                for (let oz = -0.4; oz <= 0.4; oz += 0.8) {
                    const pod = new THREE.Mesh(
                        new THREE.SphereGeometry(0.35, 8, 8),
                        new THREE.MeshStandardMaterial({ color: 0x6e3619 })
                    );
                    pod.scale.set(0.6, 1.3, 0.6);
                    pod.position.set(ox, 1.4, oz);
                    crateGroup.add(pod);
                }
            }
            crateGroup.position.set(x, 0, z);
            return crateGroup;
        }

        function createWoodenFence(x, z, length) {
            const fence = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x6f4e37 });
            for (let i = 0; i < length; i += 3) {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3, 0.4), mat);
                post.position.set(i, 1.5, 0);
                fence.add(post);
            }
            const rail1 = new THREE.Mesh(new THREE.BoxGeometry(length, 0.25, 0.2), mat);
            rail1.position.set(length / 2 - 1.5, 2.2, 0);
            const rail2 = rail1.clone();
            rail2.position.y = 1.0;
            fence.add(rail1, rail2);

            fence.position.set(x, 0, z);
            return fence;
        }

        function animateBotWalking(actor, targetX, targetZ, speed = 0.08) {
            const dx = targetX - actor.position.x;
            const dz = targetZ - actor.position.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.3) {
                actor.rotation.y = Math.atan2(dx, dz);
                actor.position.x += (dx / dist) * speed;
                actor.position.z += (dz / dist) * speed;

                actor.walkCycleTime += 0.15;
                const swing = Math.sin(actor.walkCycleTime) * 0.65;
                actor.rig.leftArmGroup.rotation.x = swing;
                actor.rig.rightArmGroup.rotation.x = -swing;
                actor.rig.leftLegGroup.rotation.x = -swing;
                actor.rig.rightLegGroup.rotation.x = swing;
                return true;
            } else {
                actor.rig.leftArmGroup.rotation.x = 0;
                actor.rig.rightArmGroup.rotation.x = 0;
                actor.rig.leftLegGroup.rotation.x = 0;
                actor.rig.rightLegGroup.rotation.x = 0;
                return false;
            }
        }

        function createArchitecturalCastle() {
            const castle = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5a626e, roughness: 0.85 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b263e, roughness: 0.6 });

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(36, 14, 4), stoneMat);
            frontWall.position.set(0, 7, 0);
            castle.add(frontWall);

            [-18, 18].forEach(tx => {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.5, 20, 12), stoneMat);
                tower.position.set(tx, 10, 0);
                castle.add(tower);

                const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(5, 7, 12), roofMat);
                towerRoof.position.set(tx, 23.5, 0);
                castle.add(towerRoof);
            });

            return castle;
        }

        function createHummusBowl() {
            const bowlGroup = new THREE.Group();
            const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.35, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
            const food = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.3, 0.1, 12), new THREE.MeshStandardMaterial({ color: 0xe9c46a }));
            food.position.y = 0.15;
            bowlGroup.add(bowl, food);
            return bowlGroup;
        }

        function createChocolateBar() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.4 }));
        }

        function createCashBill() {
            return new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.4), new THREE.MeshBasicMaterial({ color: 0x2a9d8f }));
        }

        const storyData = [
            {
                title: "1. A Childhood Amidst Cacao Fields",
                desc: "Mohamed walks amidst his dense cacao tree field (with wooden fences and crates of harvested cacao pods), plucks a cacao pod, and brings it over to the brewing cauldron.",
                camPos: [0, 10, 24],
                camLookAt: [0, 4, 0],
                skyColor: 0x5ca988,
                setup: () => {
                    worldGround.material.color.setHex(0x5ca988);
                    scene.fog.color.setHex(0x5ca988);
                    const props = [];

                    // Dense field of rounded trees matching screenshot
                    const treePositions = [
                        [-16, -10], [-8, -12], [0, -14], [10, -12], [18, -10],
                        [-14, -2], [-6, -4], [8, -3], [16, -4],
                        [-18, 6], [-10, 8], [12, 8], [18, 6]
                    ];
                    treePositions.forEach(p => {
                        const t = createExactCacaoTree(p[0], p[1]);
                        scene.add(t);
                        props.push(t);
                    });

                    // Cacao crates stack matching screenshot
                    const crate1 = createCacaoCrate(4, 2);
                    const crate2 = createCacaoCrate(6, 2);
                    scene.add(crate1, crate2);
                    props.push(crate1, crate2);

                    // Wooden fence on right edge matching screenshot
                    const fence = createWoodenFence(8, 5, 12);
                    fence.rotation.y = -Math.PI / 6;
                    scene.add(fence);
                    props.push(fence);

                    // Cauldron
                    const cauldron = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.4, 2.2, 16), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 }));
                    cauldron.position.set(-4, 1.1, 1);
                    scene.add(cauldron);
                    props.push(cauldron);

                    // Player character (Child Mohamed)
                    const mohamed = createRobloxR6({ shirtColor: 0x5bc0be, legColor: 0x2b2d42, headColor: 0xf5cd2f, isChild: true });
                    mohamed.position.set(-1, 0, 5);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Extra cacao pod
                    const pod = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshStandardMaterial({ color: 0x6e3619 }));
                    pod.scale.set(0.6, 1.3, 0.6);
                    pod.position.set(0, 3, 2);
                    scene.add(pod);
                    props.push(pod);

                    let step = 0;
                    return {
                        actors: props,
                        update: () => {
                            if (step === 0) {
                                const walk = animateBotWalking(mohamed, 3, 2, 0.05);
                                if (!walk) step = 1;
                            } else if (step === 1) {
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2;
                                pod.position.set(mohamed.position.x + 0.4, 2.2, mohamed.position.z + 0.5);
                                setTimeout(() => { step = 2; }, 800);
                            } else if (step === 2) {
                                pod.position.set(mohamed.position.x + 0.4, mohamed.position.y + 1.8, mohamed.position.z + 0.5);
                                const walk = animateBotWalking(mohamed, -3, 1.2, 0.05);
                                if (!walk) {
                                    mohamed.rotation.y = -Math.PI / 2;
                                    pod.position.set(-4, 2, 1);
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "2. Ascension to Leadership",
                desc: "Leader Mohamed hands a fresh bowl of food to the villager in front. The villager holds the bowl in hand and walks off, allowing the next person in line to step forward.",
                camPos: [0, 12, 24],
                camLookAt: [0, 3, 0],
                skyColor: 0xd4a373,
                setup: () => {
                    worldGround.material.color.setHex(0xd4a373);
                    scene.fog.color.setHex(0xd4a373);
                    const props = [];

                    const castle = createArchitecturalCastle();
                    castle.position.set(0, 0, -10);
                    scene.add(castle);
                    props.push(castle);

                    const mohamed = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x1d3557, accessoryType: 'crown' });
                    mohamed.position.set(-2, 0, 0);
                    mohamed.rotation.y = Math.PI / 2;
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Queue of 5 villagers
                    const queue = [];
                    for (let i = 0; i < 5; i++) {
                        const v = createRobloxR6({ shirtColor: 0xe9c46a, legColor: 0x264653 });
                        v.position.set(2 + i * 3.5, 0, 0);
                        v.rotation.y = -Math.PI / 2;
                        scene.add(v);
                        queue.push(v);
                        props.push(v);
                    }

                    const activeBowl = createHummusBowl();
                    scene.add(activeBowl);
                    props.push(activeBowl);

                    let state = 0; // 0: giving, 1: holding & walking off, 2: reset line
                    let timer = 0;
                    let currentReceiver = queue[0];

                    return {
                        actors: props,
                        update: () => {
                            timer += 0.04;
                            if (state === 0) {
                                // Mohamed passes bowl to current receiver
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;
                                activeBowl.position.set(-0.6, 2.5, 0);
                                if (timer > 3) {
                                    state = 1;
                                    timer = 0;
                                }
                            } else if (state === 1) {
                                // Bowl is in current receiver's hand & receiver turns and walks off
                                currentReceiver.rig.leftArmGroup.rotation.x = -Math.PI / 2.2;
                                activeBowl.position.set(currentReceiver.position.x - 0.5, currentReceiver.position.y + 2.5, currentReceiver.position.z);

                                const walking = animateBotWalking(currentReceiver, currentReceiver.position.x, 15, 0.08);

                                // Advance next people in line
                                for (let k = 1; k < queue.length; k++) {
                                    animateBotWalking(queue[k], 2 + (k - 1) * 3.5, 0, 0.05);
                                    queue[k].rotation.y = -Math.PI / 2;
                                }

                                if (!walking || timer > 4) {
                                    // Reset cycle
                                    const finished = queue.shift();
                                    finished.position.set(16, 0, 0);
                                    queue.push(finished);
                                    currentReceiver = queue[0];
                                    state = 0;
                                    timer = 0;
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "3. Warriors of Ancient Civilizations (Army vs Army)",
                desc: "Two grand armies clash on the battlefield! Armored spearmen and swordsmen collide in high-energy ancient combat.",
                camPos: [0, 16, 32],
                camLookAt: [0, 3, 0],
                skyColor: 0xc2b280,
                setup: () => {
                    worldGround.material.color.setHex(0xc2b280);
                    scene.fog.color.setHex(0xc2b280);
                    const props = [];

                    // Pyramids
                    [-28, 28].forEach(px => {
                        const p = new THREE.Mesh(new THREE.ConeGeometry(22, 28, 4), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
                        p.rotation.y = Math.PI / 4;
                        p.position.set(px, 14, -30);
                        scene.add(p);
                        props.push(p);
                    });

                    // Mohamed leading Army A
                    const mohamed = createRobloxR6({ shirtColor: 0x3a5a40, legColor: 0x111111, accessoryType: 'helmet', weapon: 'sword' });
                    mohamed.position.set(-6, 0, 0);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const armyA = [mohamed];
                    for (let a = 0; a < 7; a++) {
                        const sol = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x1d3557, accessoryType: 'helmet', weapon: 'sword' });
                        sol.position.set(-10 - Math.floor(a / 3) * 3, 0, (a % 3) * 4 - 4);
                        scene.add(sol);
                        armyA.push(sol);
                        props.push(sol);
                    }

                    const armyB = [];
                    for (let b = 0; b < 8; b++) {
                        const sol = createRobloxR6({ shirtColor: 0x9e2a2b, legColor: 0x333333, accessoryType: 'helmet', weapon: 'spear' });
                        sol.position.set(10 + Math.floor(b / 3) * 3, 0, (b % 3) * 4 - 4);
                        scene.add(sol);
                        armyB.push(sol);
                        props.push(sol);
                    }

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.06;
                            armyA.forEach((sol, i) => {
                                animateBotWalking(sol, -1.2, sol.position.z, 0.05);
                                sol.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.sin(t * 6 + i) * 0.7;
                            });

                            armyB.forEach((sol, i) => {
                                animateBotWalking(sol, 1.2, sol.position.z, 0.05);
                                sol.rig.rightArmGroup.rotation.x = -Math.PI / 3 - Math.sin(t * 6 + i) * 0.7;
                            });
                        }
                    };
                }
            },
            {
                title: "4. Conflict with the Oooga Oooga Tribe",
                desc: "Invading Oooga tribe warriors capture Mohamed in a wooden barrel and launch him off the cliff into ocean waves.",
                camPos: [10, 16, 32],
                camLookAt: [-8, 6, 0],
                skyColor: 0x1b263b,
                setup: () => {
                    worldGround.material.color.setHex(0x3a3a3a);
                    scene.fog.color.setHex(0x1b263b);
                    const props = [];

                    const cliff = new THREE.Mesh(new THREE.BoxGeometry(26, 12, 22), new THREE.MeshStandardMaterial({ color: 0x4a4e69 }));
                    cliff.position.set(-18, 5, -5);
                    scene.add(cliff);
                    props.push(cliff);

                    const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x0077b6, metalness: 0.8 }));
                    water.rotation.x = -Math.PI / 2;
                    water.position.y = 0.1;
                    scene.add(water);
                    props.push(water);

                    for (let i = 0; i < 3; i++) {
                        const tribal = createRobloxR6({ shirtColor: 0x8b4513, legColor: 0x3d2314, accessoryType: 'oooga_mask', weapon: 'spear' });
                        tribal.position.set(-16 + i * 2.5, 11, -3 + i * 2);
                        scene.add(tribal);
                        props.push(tribal);
                    }

                    const barrelGroup = new THREE.Group();
                    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 3.6, 14), new THREE.MeshStandardMaterial({ color: 0x6f4e37 }));
                    barrelGroup.add(barrel);
                    barrelGroup.position.set(-12, 12.8, 0);
                    scene.add(barrelGroup);
                    props.push(barrelGroup);

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.04;
                            if (barrelGroup.position.x < -4) {
                                barrelGroup.position.x += 0.07;
                            } else if (barrelGroup.position.y > 0.8) {
                                barrelGroup.position.x += 0.14;
                                barrelGroup.position.y -= 0.28;
                                barrelGroup.rotation.z -= 0.15;
                            } else {
                                barrelGroup.position.x += 0.08;
                                barrelGroup.position.y = 0.6 + Math.sin(t * 4) * 0.4;
                            }
                        }
                    };
                }
            },
            {
                title: "5. Arrival in Ginga (Texas Landscape)",
                desc: "Mohamed washes ashore along Texas canyon mesas, exits his barrel, and shakes hands with Alizar.",
                camPos: [0, 12, 28],
                camLookAt: [0, 3, 0],
                skyColor: 0xf4a261,
                setup: () => {
                    worldGround.material.color.setHex(0xe0a96d);
                    scene.fog.color.setHex(0xf4a261);
                    const props = [];

                    [-30, 0, 30].forEach((mx, i) => {
                        const mesa = new THREE.Mesh(new THREE.CylinderGeometry(12 + i * 2, 16 + i * 2, 16, 8), new THREE.MeshStandardMaterial({ color: 0xb5651d }));
                        mesa.position.set(mx, 8, -25);
                        scene.add(mesa);
                        props.push(mesa);
                    });

                    const brokenBarrel = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 1.8, 8, 1, false, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0x6f4e37 }));
                    brokenBarrel.position.set(-8, 0.8, 0);
                    brokenBarrel.rotation.z = Math.PI / 2;
                    scene.add(brokenBarrel);
                    props.push(brokenBarrel);

                    const mohamed = createRobloxR6({ shirtColor: 0x5bc0be, legColor: 0x2b2d42 });
                    mohamed.position.set(-6, 0, 0);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xe5a93b, legColor: 0x3d2314 });
                    alizar.position.set(6, 0, 0);
                    scene.add(alizar);
                    props.push(alizar);

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.05;
                            const mMoving = animateBotWalking(mohamed, -1.2, 0, 0.05);
                            const aMoving = animateBotWalking(alizar, 1.2, 0, 0.05);

                            if (!mMoving && !aMoving) {
                                mohamed.rotation.y = Math.PI / 2;
                                alizar.rotation.y = -Math.PI / 2;
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 3) * 0.1;
                                alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 3) * 0.1;
                            }
                        }
                    };
                }
            },
            {
                title: "6. Embracing the Texan Way (A&M Snacks Shop)",
                desc: "Customers face shop owners Mohamed & Alizar. Each customer approaches holding green cash, gives it to Mohamed, receives chocolate from Alizar, and walks away.",
                camPos: [0, 12, 22],
                camLookAt: [0, 3, 0],
                skyColor: 0xdda15e,
                setup: () => {
                    worldGround.material.color.setHex(0xdda15e);
                    scene.fog.color.setHex(0xdda15e);
                    const props = [];

                    const shop = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 6), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                    shop.position.set(0, 4, -4);
                    const signBoard = new THREE.Mesh(new THREE.BoxGeometry(12, 3, 0.4), new THREE.MeshStandardMaterial({ map: createSignTexture("A&M SNACKS") }));
                    signBoard.position.set(0, 8.5, -0.9);
                    scene.add(shop, signBoard);
                    props.push(shop, signBoard);

                    // Owners behind counter (matching screenshot)
                    const mohamed = createRobloxR6({ shirtColor: 0x5bc0be, legColor: 0x2b2d42 }); // cyan shirt
                    mohamed.position.set(-2, 0, 0);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xe5a93b, legColor: 0x3d2314 }); // tan shirt
                    alizar.position.set(2, 0, 0);
                    scene.add(alizar);
                    props.push(alizar);

                    // Interactive Exchange Items
                    const cashItem = createCashBill();
                    const chocItem = createChocolateBar();
                    scene.add(cashItem, chocItem);
                    props.push(cashItem, chocItem);

                    // Line of customers facing owners (looking -Z)
                    const customers = [];
                    for (let c = 0; c < 6; c++) {
                        const cust = createRobloxR6({ shirtColor: 0x00bbf9, legColor: 0x111111 });
                        cust.position.set(-2, 0, 4 + c * 3.5);
                        cust.rotation.y = 0; // facing shop owners
                        scene.add(cust);
                        customers.push(cust);
                        props.push(cust);
                    }

                    let step = 0;
                    let timer = 0;
                    let activeCust = customers[0];

                    return {
                        actors: props,
                        update: () => {
                            timer += 0.04;

                            if (step === 0) {
                                // Customer advances to counter holding cash bill
                                const walking = animateBotWalking(activeCust, -0.5, 2.2, 0.06);
                                activeCust.rotation.y = 0;
                                activeCust.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;
                                cashItem.position.set(activeCust.position.x + 0.4, 2.4, activeCust.position.z - 0.5);
                                chocItem.position.set(alizar.position.x - 0.4, 2.4, alizar.position.z + 0.8);

                                if (!walking) {
                                    step = 1;
                                    timer = 0;
                                }
                            } else if (step === 1) {
                                // Transaction: Mohamed reaches for cash, Alizar hands chocolate bar to customer
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2;
                                alizar.rig.leftArmGroup.rotation.x = -Math.PI / 2.2;
                                cashItem.position.set(mohamed.position.x + 0.4, 2.4, mohamed.position.z + 0.8);

                                chocItem.position.set(activeCust.position.x + 0.4, 2.4, activeCust.position.z - 0.5);

                                if (timer > 2) {
                                    step = 2;
                                    timer = 0;
                                }
                            } else if (step === 2) {
                                // Customer takes chocolate in hand and walks away
                                activeCust.rig.rightArmGroup.rotation.x = -Math.PI / 2.5;
                                chocItem.position.set(activeCust.position.x + 0.4, 2.4, activeCust.position.z);

                                const walkingAway = animateBotWalking(activeCust, 12, activeCust.position.z, 0.07);

                                // Advance line
                                for (let k = 1; k < customers.length; k++) {
                                    animateBotWalking(customers[k], -2, 4 + (k - 1) * 3.5, 0.05);
                                    customers[k].rotation.y = 0;
                                }

                                if (!walkingAway || timer > 3.5) {
                                    // Recycle customer line
                                    const done = customers.shift();
                                    done.position.set(-2, 0, 4 + (customers.length) * 3.5);
                                    done.rotation.y = 0;
                                    customers.push(done);

                                    activeCust = customers[0];
                                    step = 0;
                                    timer = 0;
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "7. The Threat of Corruption",
                desc: "Corrupt forces strike! Mohamed & Alizar get hit multiple times by spear wielders and collapse onto the ground while another arsonist burns the shop pitch black.",
                camPos: [0, 12, 22],
                camLookAt: [0, 3, 0],
                skyColor: 0x1b0000,
                setup: () => {
                    worldGround.material.color.setHex(0x181310);
                    scene.fog.color.setHex(0x1b0000);
                    const props = [];

                    const shopMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
                    const shop = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 6), shopMat);
                    shop.position.set(0, 4, -4);
                    scene.add(shop);
                    props.push(shop);

                    const fireLight = new THREE.PointLight(0xff3300, 8, 40);
                    fireLight.position.set(0, 4, -1);
                    scene.add(fireLight);
                    props.push(fireLight);

                    // Smoke & Embers
                    const embers = [];
                    for (let i = 0; i < 40; i++) {
                        const emb = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: 0xff6600 }));
                        emb.position.set((Math.random() - 0.5) * 14, Math.random() * 8, -4 + (Math.random() - 0.5) * 4);
                        scene.add(emb);
                        embers.push(emb);
                        props.push(emb);
                    }

                    // Mohamed and Alizar
                    const mohamed = createRobloxR6({ shirtColor: 0x5bc0be, legColor: 0x2b2d42 });
                    mohamed.position.set(-2.5, 0, 1.5);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xe5a93b, legColor: 0x3d2314 });
                    alizar.position.set(2.5, 0, 1.5);
                    scene.add(alizar);
                    props.push(alizar);

                    // 2 Attackers beating Mohamed and Alizar (matching screenshot placement)
                    const attacker1 = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'spear' });
                    attacker1.position.set(-4.5, 0, 1.5);
                    attacker1.rotation.y = Math.PI / 2;

                    const attacker2 = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'spear' });
                    attacker2.position.set(4.5, 0, 1.5);
                    attacker2.rotation.y = -Math.PI / 2;
                    scene.add(attacker1, attacker2);
                    props.push(attacker1, attacker2);

                    // Arsonist setting shop on fire
                    const arsonist = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'torch' });
                    arsonist.position.set(0, 0, -1);
                    scene.add(arsonist);
                    props.push(arsonist);

                    let timer = 0;
                    let hitsCount = 0;
                    let fallen = false;

                    return {
                        actors: props,
                        update: () => {
                            timer += 0.05;

                            // Shop burning black
                            shopMat.color.lerp(new THREE.Color(0x020202), 0.015);
                            fireLight.intensity = 6 + Math.sin(timer * 20) * 3;

                            if (!fallen) {
                                // Attackers striking
                                attacker1.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.sin(timer * 15) * 0.9;
                                attacker2.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.cos(timer * 15) * 0.9;

                                // Mohamed & Alizar stagger on hit
                                mohamed.rotation.z = Math.sin(timer * 15) * 0.25;
                                alizar.rotation.z = -Math.sin(timer * 15) * 0.25;

                                hitsCount += 0.05;
                                if (hitsCount > 3.5) {
                                    fallen = true;
                                }
                            } else {
                                // Mohamed & Alizar fall onto the ground flat
                                if (mohamed.rotation.x > -Math.PI / 2) {
                                    mohamed.rotation.x -= 0.12;
                                    mohamed.position.y = 0.5;
                                }
                                if (alizar.rotation.x > -Math.PI / 2) {
                                    alizar.rotation.x -= 0.12;
                                    alizar.position.y = 0.5;
                                }
                            }

                            embers.forEach(p => {
                                p.position.y += 0.12;
                                if (p.position.y > 10) p.position.y = 0.5;
                            });
                        }
                    };
                }
            },
            {
                title: "8. Mohamed’s Legacy (The Mirja)",
                desc: "A massive crowd of devoted followers bow in unity, honoring Mohamed's enduring legacy as a profound leader.",
                camPos: [0, 14, 32],
                camLookAt: [0, 4, 0],
                skyColor: 0xfffae6,
                setup: () => {
                    worldGround.material.color.setHex(0x52b788);
                    scene.fog.color.setHex(0xfffae6);
                    const props = [];

                    const dais = new THREE.Mesh(new THREE.CylinderGeometry(7, 8, 2.5, 20), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8 }));
                    dais.position.set(0, 1.25, -2);
                    scene.add(dais);
                    props.push(dais);

                    const auraLight = new THREE.PointLight(0xffd700, 6, 35);
                    auraLight.position.set(0, 6, -2);
                    scene.add(auraLight);
                    props.push(auraLight);

                    const mohamed = createRobloxR6({ shirtColor: 0xffffff, legColor: 0xffffff, headColor: 0xf5cd2f, accessoryType: 'crown' });
                    mohamed.position.set(0, 2.5, -2);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Massive crowd of followers obeying/bowing
                    const followers = [];
                    for (let x = -16; x <= 16; x += 4) {
                        for (let z = 4; z <= 12; z += 4) {
                            const fol = createRobloxR6({ shirtColor: 0x74c69d, legColor: 0x1b4332 });
                            fol.position.set(x + (Math.random() - 0.5), 0, z);
                            scene.add(fol);
                            followers.push(fol);
                            props.push(fol);
                        }
                    }

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.03;
                            auraLight.intensity = 4 + Math.sin(t * 3) * 2;
                            mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 2) * 0.1;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 2) * 0.1;

                            followers.forEach((f, idx) => {
                                f.rig.torso.rotation.x = Math.PI / 6 + Math.sin(t * 2 + idx) * 0.1;
                            });
                        }
                    };
                }
            }
        ];

        let currentSceneIndex = 0;
        let activeSceneInstance = null;
        let autoPlay = true;
        let sceneStartTime = Date.now();

        function clearCurrentScene() {
            if (activeSceneInstance && activeSceneInstance.actors) {
                activeSceneInstance.actors.forEach(actor => scene.remove(actor));
            }
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const child = scene.children[i];
                if (child !== worldGround && child !== sun && child !== ambientLight) {
                    scene.remove(child);
                }
            }
        }

        function loadScene(index) {
            clearCurrentScene();
            currentSceneIndex = index;
            sceneStartTime = Date.now();

            const data = storyData[index];
            document.getElementById('scene-title').innerText = data.title;
            document.getElementById('scene-description').innerText = data.desc;
            document.getElementById('scene-counter').innerText = `SCENE ${index + 1} / ${storyData.length}`;

            camera.position.set(...data.camPos);
            camera.lookAt(...data.camLookAt);

            activeSceneInstance = data.setup();
        }

        function nextScene() {
            loadScene((currentSceneIndex + 1) % storyData.length);
        }

        function prevScene() {
            loadScene((currentSceneIndex - 1 + storyData.length) % storyData.length);
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('autoplay-btn').innerText = `Autoplay: ${autoPlay ? 'ON' : 'OFF'}`;
            sceneStartTime = Date.now();
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - sceneStartTime;
            if (autoPlay) {
                const progress = Math.min((elapsed / SCENE_DURATION_MS) * 100, 100);
                document.getElementById('progress-bar').style.width = `${progress}%`;

                if (elapsed >= SCENE_DURATION_MS) {
                    nextScene();
                }
            } else {
                document.getElementById('progress-bar').style.width = `0%`;
            }

            if (activeSceneInstance && activeSceneInstance.update) {
                activeSceneInstance.update();
            }

            renderer.render(scene, camera);
        }

        loadScene(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
