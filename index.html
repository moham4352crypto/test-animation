<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Journey of Mohamed - Enhanced Cinematic 3D Storyboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #story-ui {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 88%;
            max-width: 950px;
            background: rgba(10, 14, 22, 0.94);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(0, 198, 255, 0.5);
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        #progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #ffcc00);
            transition: width 0.1s linear;
        }

        #scene-title {
            margin: 0;
            font-size: 22px;
            color: #ffcc00;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }

        #scene-description {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            min-height: 52px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00c6ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background: #00c6ff;
            color: #000;
            box-shadow: 0 0 12px #00c6ff;
        }

        #scene-counter {
            font-family: monospace;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="story-ui">
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <h2 id="scene-title">Loading World...</h2>
        <p id="scene-description">Building cinematic 3D scenes and character models...</p>
        <div class="controls-row">
            <span id="scene-counter">SCENE 1 / 8</span>
            <div class="btn-group">
                <button onclick="prevScene()">◄ Prev</button>
                <button id="autoplay-btn" onclick="toggleAutoPlay()">Autoplay: ON</button>
                <button onclick="nextScene()">Next ►</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const SCENE_DURATION_MS = 15000; // 15 seconds per scene (120 seconds / 2 minutes total)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6ba4b8);
        scene.fog = new THREE.FogExp2(0x6ba4b8, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.4);
        sun.position.set(60, 100, 40);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        const ambientLight = new THREE.AmbientLight(0x778899, 0.85);
        scene.add(ambientLight);

        const worldGround = new THREE.Mesh(
            new THREE.BoxGeometry(500, 2, 500),
            new THREE.MeshStandardMaterial({ color: 0x3a5a40, roughness: 0.85 })
        );
        worldGround.position.y = -1;
        worldGround.receiveShadow = true;
        scene.add(worldGround);

        // Canvas Texture Helper for Signs & Cash
        function createSignTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#3d2314';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, 502, 118);
            ctx.fillStyle = '#3d2314';
            ctx.font = 'bold 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // Guaranteed Full R6 Roblox Avatar with Both Arms & Legs
        function createRobloxR6(opts = {}) {
            const {
                shirtColor = 0x00a2ff,
                legColor = 0x111111,
                headColor = 0xf5cd2f,
                accessoryType = null,
                isChild = false,
                weapon = null
            } = opts;

            const avatar = new THREE.Group();
            const scaleFactor = isChild ? 0.65 : 1;
            avatar.scale.set(scaleFactor, scaleFactor, scaleFactor);

            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const headMat = new THREE.MeshStandardMaterial({ color: headColor, roughness: 0.3 });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor, roughness: 0.6 });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.5 });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.85, roughness: 0.25 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            torso.castShadow = true;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            head.castShadow = true;
            avatar.add(head);

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, 0.05), eyeMat);
            eyeL.position.set(-0.3, 4.7, 0.61);
            const eyeR = eyeL.clone();
            eyeR.position.x = 0.3;
            avatar.add(eyeL, eyeR);

            if (accessoryType === 'helmet') {
                const helmet = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.65, 1.38), steelMat);
                helmet.position.y = 5.15;
                avatar.add(helmet);
            } else if (accessoryType === 'crown') {
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.65, 0.55, 6), goldMat);
                crown.position.y = 5.3;
                avatar.add(crown);
            } else if (accessoryType === 'oooga_mask') {
                const mask = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.2), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                mask.position.set(0, 4.6, 0.65);
                const paint = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.05), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                paint.position.set(0, 4.7, 0.76);
                avatar.add(mask, paint);
            }

            // Left Arm
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            // Right Arm
            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);
            avatar.add(rightArmGroup);

            if (weapon === 'sword') {
                const swordGroup = new THREE.Group();
                swordGroup.position.set(0, -1.8, 0.2);
                swordGroup.rotation.x = Math.PI / 2.2;
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.12, 0.25), goldMat);
                hilt.position.y = 0.4;
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.8, 0.3), steelMat);
                blade.position.y = 1.8;
                swordGroup.add(handle, hilt, blade);
                rightArmGroup.add(swordGroup);
            } else if (weapon === 'spear') {
                const spearGroup = new THREE.Group();
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                const tip = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 4), steelMat);
                tip.position.y = 2.5;
                spearGroup.add(shaft, tip);
                spearGroup.position.set(0, -1, 0.5);
                spearGroup.rotation.x = Math.PI / 3;
                rightArmGroup.add(spearGroup);
            } else if (weapon === 'torch') {
                const torchGroup = new THREE.Group();
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
                const flame = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.4), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
                flame.position.y = 1.4;
                torchGroup.add(handle, flame);
                torchGroup.position.set(0, -1, 0.4);
                torchGroup.rotation.x = Math.PI / 4;
                rightArmGroup.add(torchGroup);
            }

            // Left Leg
            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            // Right Leg
            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, torso };
            avatar.walkCycleTime = Math.random() * 10;
            return avatar;
        }

        function animateBotWalking(actor, targetX, targetZ, speed = 0.08) {
            const dx = targetX - actor.position.x;
            const dz = targetZ - actor.position.z;
            const dist = Math.hypot(dx, dz);

            if (dist > 0.3) {
                actor.rotation.y = Math.atan2(dx, dz);
                actor.position.x += (dx / dist) * speed;
                actor.position.z += (dz / dist) * speed;

                actor.walkCycleTime += 0.15;
                const swing = Math.sin(actor.walkCycleTime) * 0.65;
                actor.rig.leftArmGroup.rotation.x = swing;
                actor.rig.rightArmGroup.rotation.x = -swing;
                actor.rig.leftLegGroup.rotation.x = -swing;
                actor.rig.rightLegGroup.rotation.x = swing;
                return true;
            } else {
                actor.rig.leftArmGroup.rotation.x = 0;
                actor.rig.rightArmGroup.rotation.x = 0;
                actor.rig.leftLegGroup.rotation.x = 0;
                actor.rig.rightLegGroup.rotation.x = 0;
                return false;
            }
        }

        function createArchitecturalCastle() {
            const castle = new THREE.Group();
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5a626e, roughness: 0.85 });
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b263e, roughness: 0.6 });

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(36, 14, 4), stoneMat);
            frontWall.position.set(0, 7, 0);
            castle.add(frontWall);

            [-18, 18].forEach(tx => {
                const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.5, 20, 12), stoneMat);
                tower.position.set(tx, 10, 0);
                castle.add(tower);

                const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(5, 7, 12), roofMat);
                towerRoof.position.set(tx, 23.5, 0);
                castle.add(towerRoof);
            });

            return castle;
        }

        function createCactus(x, z) {
            const cactus = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.7 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6), mat);
            trunk.position.y = 3;
            cactus.add(trunk);
            const arm1 = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 3), mat);
            arm1.position.set(1, 4, 0); arm1.rotation.z = -Math.PI / 3;
            cactus.add(arm1);
            cactus.position.set(x, 0, z);
            return cactus;
        }

        const storyData = [
            {
                title: "1. A Childhood Amidst Cacao Fields",
                desc: "Amidst a dense forest of cacao trees, 8-year-old Mohamed physically walks up to a tree, plucks a fresh cacao pod, and carries it back to the cauldron to brew the cacao elixir.",
                camPos: [-6, 10, 26],
                camLookAt: [0, 3, 0],
                skyColor: 0x2d6a4f,
                setup: () => {
                    worldGround.material.color.setHex(0x2d6a4f);
                    scene.fog.color.setHex(0x2d6a4f);
                    const props = [];

                    // Dense Field of Trees (24 Trees)
                    for (let x = -35; x <= 35; x += 14) {
                        for (let z = -25; z <= 15; z += 12) {
                            if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
                            const tree = new THREE.Group();
                            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 12), new THREE.MeshStandardMaterial({ color: 0x4a2e1b }));
                            trunk.position.y = 6;
                            const leaves = new THREE.Mesh(new THREE.SphereGeometry(5.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x1b4332 }));
                            leaves.position.y = 11;
                            tree.add(trunk, leaves);
                            tree.position.set(x + (Math.random() - 0.5) * 3, 0, z + (Math.random() - 0.5) * 3);
                            scene.add(tree);
                            props.push(tree);
                        }
                    }

                    const mohamed = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x264653, headColor: 0xe9c46a, isChild: true });
                    mohamed.position.set(-10, 0, 4);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const cauldron = new THREE.Mesh(new THREE.CylinderGeometry(2, 1.5, 2.5, 16), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 }));
                    cauldron.position.set(-5, 1.25, 2);
                    scene.add(cauldron);
                    props.push(cauldron);

                    const targetTree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.8, 14), new THREE.MeshStandardMaterial({ color: 0x4a2e1b }));
                    trunk.position.y = 7;
                    const leaves = new THREE.Mesh(new THREE.SphereGeometry(6, 10, 10), new THREE.MeshStandardMaterial({ color: 0x1b4332 }));
                    leaves.position.y = 12;
                    targetTree.add(trunk, leaves);
                    targetTree.position.set(4, 0, 1);
                    scene.add(targetTree);
                    props.push(targetTree);

                    const cacaoPod = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
                    cacaoPod.scale.set(0.6, 1.4, 0.6);
                    cacaoPod.position.set(4, 4.2, 2.2);
                    scene.add(cacaoPod);
                    props.push(cacaoPod);

                    let step = 0;
                    return {
                        actors: props,
                        update: () => {
                            if (step === 0) {
                                const walking = animateBotWalking(mohamed, 3, 2.2, 0.06);
                                if (!walking) step = 1;
                            } else if (step === 1) {
                                mohamed.rotation.y = 0;
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2;
                                cacaoPod.position.set(mohamed.position.x + 0.4, 2.5, mohamed.position.z + 0.5);
                                setTimeout(() => { step = 2; }, 1000);
                            } else if (step === 2) {
                                cacaoPod.position.set(mohamed.position.x + 0.4, mohamed.position.y + 1.8, mohamed.position.z + 0.5);
                                const walking = animateBotWalking(mohamed, -4, 2.5, 0.06);
                                if (!walking) {
                                    mohamed.rotation.y = -Math.PI / 2;
                                    mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 4;
                                    cacaoPod.position.set(-5, 2.2, 2);
                                }
                            }
                        }
                    };
                }
            },
            {
                title: "2. Ascension to Leadership",
                desc: "Leader Mohamed stands at the banquet table behind his castle, handing out bowls of fresh hummus to a long, organized line of tribe members.",
                camPos: [0, 14, 28],
                camLookAt: [0, 4, 0],
                skyColor: 0xd4a373,
                setup: () => {
                    worldGround.material.color.setHex(0xd4a373);
                    scene.fog.color.setHex(0xd4a373);
                    const props = [];

                    const castleBack = createArchitecturalCastle();
                    castleBack.position.set(0, 0, -12);
                    scene.add(castleBack);
                    props.push(castleBack);

                    const table = new THREE.Mesh(new THREE.BoxGeometry(12, 1.8, 3), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                    table.position.set(0, 0.9, 0);
                    scene.add(table);
                    props.push(table);

                    const mohamed = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x1d3557, headColor: 0xf5cd2f, accessoryType: 'crown' });
                    mohamed.position.set(0, 0, -2);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Line of 6 villagers queuing for hummus
                    const lineQueue = [];
                    for (let i = 0; i < 6; i++) {
                        const villager = createRobloxR6({ shirtColor: 0xe9c46a, legColor: 0x264653 });
                        villager.position.set(-1.5 + (i * 0.2), 0, 4 + (i * 3.5));
                        scene.add(villager);
                        lineQueue.push(villager);
                        props.push(villager);
                    }

                    const activeBowl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 0.4, 12), new THREE.MeshStandardMaterial({ color: 0xe9c46a }));
                    activeBowl.position.set(0, 2.1, 0);
                    scene.add(activeBowl);
                    props.push(activeBowl);

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.04;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + Math.sin(t * 3) * 0.2;

                            lineQueue.forEach((v, idx) => {
                                if (idx === 0) {
                                    animateBotWalking(v, 0, 1.8, 0.04);
                                    v.rig.leftArmGroup.rotation.x = -Math.PI / 3;
                                } else {
                                    animateBotWalking(v, -1.5, 3.5 + (idx * 3.2), 0.04);
                                }
                            });
                        }
                    };
                }
            },
            {
                title: "3. Warriors of Ancient Civilizations (Army vs Army)",
                desc: "Two grand armored armies collide on the battlefield! Mohamed leads the Egyptian-Mesopotamian forces into battle with clashing swords and thrusting spears.",
                camPos: [0, 18, 36],
                camLookAt: [0, 3, 0],
                skyColor: 0xc2b280,
                setup: () => {
                    worldGround.material.color.setHex(0xc2b280);
                    scene.fog.color.setHex(0xc2b280);
                    const props = [];

                    // Pyramids in background
                    [-30, 30].forEach(px => {
                        const pyramid = new THREE.Mesh(new THREE.ConeGeometry(25, 30, 4), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.9 }));
                        pyramid.rotation.y = Math.PI / 4;
                        pyramid.position.set(px, 15, -35);
                        scene.add(pyramid);
                        props.push(pyramid);
                    });

                    // Mohamed leading Team A
                    const mohamed = createRobloxR6({ shirtColor: 0x3a5a40, legColor: 0x111111, accessoryType: 'helmet', weapon: 'sword' });
                    mohamed.position.set(-6, 0, 0);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Team A (Egyptian Soldiers - 8 bots)
                    const armyA = [mohamed];
                    for (let a = 0; a < 7; a++) {
                        const sol = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x1d3557, accessoryType: 'helmet', weapon: 'sword' });
                        sol.position.set(-10 - Math.floor(a / 3) * 3, 0, (a % 3) * 4 - 4);
                        scene.add(sol);
                        armyA.push(sol);
                        props.push(sol);
                    }

                    // Team B (Enemy Army - 8 bots)
                    const armyB = [];
                    for (let b = 0; b < 8; b++) {
                        const sol = createRobloxR6({ shirtColor: 0x9e2a2b, legColor: 0x333333, accessoryType: 'helmet', weapon: 'spear' });
                        sol.position.set(10 + Math.floor(b / 3) * 3, 0, (b % 3) * 4 - 4);
                        scene.add(sol);
                        armyB.push(sol);
                        props.push(sol);
                    }

                    let time = 0;
                    return {
                        actors: props,
                        update: () => {
                            time += 0.06;
                            armyA.forEach((sol, i) => {
                                animateBotWalking(sol, -1.5, sol.position.z, 0.05);
                                sol.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.sin(time * 5 + i) * 0.7;
                            });

                            armyB.forEach((sol, i) => {
                                animateBotWalking(sol, 1.5, sol.position.z, 0.05);
                                sol.rig.rightArmGroup.rotation.x = -Math.PI / 3 - Math.sin(time * 5 + i) * 0.7;
                            });
                        }
                    };
                }
            },
            {
                title: "4. Conflict with the Oooga Oooga Tribe",
                desc: "The invading Oooga Oooga tribe overpowers the fortress, locking Mohamed into a heavy wooden barrel and hurling him into turbulent ocean waters.",
                camPos: [10, 16, 32],
                camLookAt: [-8, 6, 0],
                skyColor: 0x1b263b,
                setup: () => {
                    worldGround.material.color.setHex(0x3a3a3a);
                    scene.fog.color.setHex(0x1b263b);
                    const props = [];

                    const cliff = new THREE.Mesh(new THREE.BoxGeometry(26, 12, 22), new THREE.MeshStandardMaterial({ color: 0x4a4e69 }));
                    cliff.position.set(-18, 5, -5);
                    scene.add(cliff);
                    props.push(cliff);

                    const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x0077b6, metalness: 0.8 }));
                    water.rotation.x = -Math.PI / 2;
                    water.position.y = 0.1;
                    scene.add(water);
                    props.push(water);

                    for (let i = 0; i < 3; i++) {
                        const tribal = createRobloxR6({ shirtColor: 0x8b4513, legColor: 0x3d2314, accessoryType: 'oooga_mask', weapon: 'spear' });
                        tribal.position.set(-16 + i * 2.5, 11, -3 + i * 2);
                        scene.add(tribal);
                        props.push(tribal);
                    }

                    const barrelGroup = new THREE.Group();
                    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 3.6, 14), new THREE.MeshStandardMaterial({ color: 0x6f4e37 }));
                    barrelGroup.add(barrel);
                    barrelGroup.position.set(-12, 12.8, 0);
                    scene.add(barrelGroup);
                    props.push(barrelGroup);

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.04;
                            if (barrelGroup.position.x < -4) {
                                barrelGroup.position.x += 0.07;
                            } else if (barrelGroup.position.y > 0.8) {
                                barrelGroup.position.x += 0.14;
                                barrelGroup.position.y -= 0.28;
                                barrelGroup.rotation.z -= 0.15;
                            } else {
                                barrelGroup.position.x += 0.08;
                                barrelGroup.position.y = 0.6 + Math.sin(t * 4) * 0.4;
                            }
                        }
                    };
                }
            },
            {
                title: "5. Arrival in Ginga (Texas Landscape)",
                desc: "Mohamed's barrel washes ashore along rich Texan canyon mesas and desert sands. Mohamed emerges and shakes hands with Alizar to seal their alliance.",
                camPos: [0, 12, 28],
                camLookAt: [0, 3, 0],
                skyColor: 0xf4a261,
                setup: () => {
                    worldGround.material.color.setHex(0xe0a96d);
                    scene.fog.color.setHex(0xf4a261);
                    const props = [];

                    // Grand Desert Mesas & Rock Formations in background
                    [-30, 0, 30].forEach((mx, i) => {
                        const mesa = new THREE.Mesh(new THREE.CylinderGeometry(12 + i * 2, 16 + i * 2, 16, 8), new THREE.MeshStandardMaterial({ color: 0xb5651d, roughness: 0.9 }));
                        mesa.position.set(mx, 8, -25);
                        scene.add(mesa);
                        props.push(mesa);
                    });

                    // Cacti field
                    const cactiPositions = [[-14, -4], [-8, -12], [10, -6], [16, -10], [-18, 4], [18, 6]];
                    cactiPositions.forEach(p => {
                        const c = createCactus(p[0], p[1]);
                        scene.add(c);
                        props.push(c);
                    });

                    const brokenBarrel = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 1.8, 8, 1, false, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0x6f4e37 }));
                    brokenBarrel.position.set(-8, 0.8, 0);
                    brokenBarrel.rotation.z = Math.PI / 2;
                    scene.add(brokenBarrel);
                    props.push(brokenBarrel);

                    const mohamed = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x264653 });
                    mohamed.position.set(-6, 0, 0);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xf4a261, legColor: 0x6b705c });
                    alizar.position.set(6, 0, 0);
                    scene.add(alizar);
                    props.push(alizar);

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.05;
                            const mMoving = animateBotWalking(mohamed, -1.2, 0, 0.05);
                            const aMoving = animateBotWalking(alizar, 1.2, 0, 0.05);

                            if (!mMoving && !aMoving) {
                                mohamed.rotation.y = Math.PI / 2;
                                alizar.rotation.y = -Math.PI / 2;
                                mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 3) * 0.1;
                                alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(t * 3) * 0.1;
                            }
                        }
                    };
                }
            },
            {
                title: "6. Embracing the Texan Way (A&M Snacks Market)",
                desc: "A huge crowd of hungry customers line up at A&M Snacks! Customers exchange money cash bills while Mohamed and Alizar hand out sweet chocolate bars.",
                camPos: [0, 16, 36],
                camLookAt: [0, 3, 0],
                skyColor: 0xdda15e,
                setup: () => {
                    worldGround.material.color.setHex(0xdda15e);
                    scene.fog.color.setHex(0xdda15e);
                    const props = [];

                    const shop = new THREE.Mesh(new THREE.BoxGeometry(18, 8, 7), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
                    shop.position.set(0, 4, -5);
                    const signBoard = new THREE.Mesh(new THREE.BoxGeometry(14, 3.2, 0.4), new THREE.MeshStandardMaterial({ map: createSignTexture("A&M SNACKS") }));
                    signBoard.position.set(0, 8.5, -1.3);
                    scene.add(shop, signBoard);
                    props.push(shop, signBoard);

                    const counter = new THREE.Mesh(new THREE.BoxGeometry(14, 1.8, 1.4), new THREE.MeshStandardMaterial({ color: 0x5c3d1e }));
                    counter.position.set(0, 0.9, 0.2);
                    scene.add(counter);
                    props.push(counter);

                    const mohamed = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x264653 });
                    mohamed.position.set(-3, 0, -1);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xf4a261, legColor: 0x6b705c });
                    alizar.position.set(3, 0, -1);
                    scene.add(alizar);
                    props.push(alizar);

                    // 8 Customers lined up
                    const customers = [];
                    for (let c = 0; c < 8; c++) {
                        const cust = createRobloxR6({ shirtColor: 0x00bbf9, legColor: 0x111111 });
                        cust.position.set((c - 3.5) * 3, 0, 4 + (c % 2) * 2.5);
                        scene.add(cust);
                        customers.push(cust);
                        props.push(cust);
                    }

                    // Floating Cash & Chocolate exchange meshes
                    const cashMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.4), new THREE.MeshBasicMaterial({ color: 0x2a9d8f }));
                    cashMesh.position.set(-2, 2.2, 1.5);
                    const chocMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.8), new THREE.MeshBasicMaterial({ color: 0x4a2e1b }));
                    chocMesh.position.set(3, 2.2, 1.5);
                    scene.add(cashMesh, chocMesh);
                    props.push(cashMesh, chocMesh);

                    let t = 0;
                    return {
                        actors: props,
                        update: () => {
                            t += 0.05;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + Math.sin(t * 4) * 0.2;
                            alizar.rig.rightArmGroup.rotation.x = -Math.PI / 2.5 + Math.sin(t * 4) * 0.2;

                            cashMesh.position.y = 2.2 + Math.sin(t * 5) * 0.2;
                            chocMesh.position.y = 2.2 + Math.cos(t * 5) * 0.2;

                            customers.forEach((cust, idx) => {
                                cust.rig.rightArmGroup.rotation.x = -Math.PI / 3 + Math.sin(t * 2 + idx) * 0.15;
                            });
                        }
                    };
                }
            },
            {
                title: "7. The Threat of Corruption",
                desc: "Corrupt enforcer squads strike! Two forces beat up Mohamed & Alizar while another squad sets the snack shop ablaze, burning it pitch black.",
                camPos: [0, 14, 28],
                camLookAt: [0, 3, 0],
                skyColor: 0x1b0000,
                setup: () => {
                    worldGround.material.color.setHex(0x181310);
                    scene.fog.color.setHex(0x1b0000);
                    const props = [];

                    const shopMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
                    const shop = new THREE.Mesh(new THREE.BoxGeometry(18, 8, 7), shopMat);
                    shop.position.set(0, 4, -4);
                    scene.add(shop);
                    props.push(shop);

                    const fireLight = new THREE.PointLight(0xff3300, 8, 40);
                    fireLight.position.set(0, 4, -1);
                    scene.add(fireLight);
                    props.push(fireLight);

                    // Smoke / Embers
                    const embers = [];
                    for (let i = 0; i < 50; i++) {
                        const emb = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshBasicMaterial({ color: 0xff8800 }));
                        emb.position.set((Math.random() - 0.5) * 14, Math.random() * 8, -4 + (Math.random() - 0.5) * 4);
                        scene.add(emb);
                        embers.push(emb);
                        props.push(emb);
                    }

                    // Mohamed & Alizar being attacked
                    const mohamed = createRobloxR6({ shirtColor: 0x2a9d8f, legColor: 0x264653 });
                    mohamed.position.set(-3, 0, 3);
                    scene.add(mohamed);
                    props.push(mohamed);

                    const alizar = createRobloxR6({ shirtColor: 0xf4a261, legColor: 0x6b705c });
                    alizar.position.set(3, 0, 3);
                    scene.add(alizar);
                    props.push(alizar);

                    // 2 Squads attacking Mohamed & Alizar
                    const attacker1 = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'spear' });
                    attacker1.position.set(-4.5, 0, 3);
                    const attacker2 = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'spear' });
                    attacker2.position.set(4.5, 0, 3);
                    scene.add(attacker1, attacker2);
                    props.push(attacker1, attacker2);

                    // Arson Squad throwing torches
                    const arsonist = createRobloxR6({ shirtColor: 0x111111, legColor: 0x050505, accessoryType: 'helmet', weapon: 'torch' });
                    arsonist.position.set(0, 0, 0);
                    scene.add(arsonist);
                    props.push(arsonist);

                    let burnProgress = 0;
                    return {
                        actors: props,
                        update: () => {
                            burnProgress += 0.003;
                            // Dynamically transition shop color to pitch black charcoal
                            shopMat.color.lerp(new THREE.Color(0x050505), Math.min(burnProgress, 1));
                            fireLight.intensity = 6 + Math.sin(burnProgress * 40) * 3;

                            // Beating animation
                            attacker1.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.sin(burnProgress * 50) * 0.8;
                            attacker2.rig.rightArmGroup.rotation.x = -Math.PI / 2 + Math.cos(burnProgress * 50) * 0.8;
                            mohamed.rig.torso.rotation.z = Math.sin(burnProgress * 20) * 0.2;
                            alizar.rig.torso.rotation.z = -Math.sin(burnProgress * 20) * 0.2;

                            embers.forEach(p => {
                                p.position.y += 0.12;
                                if (p.position.y > 10) p.position.y = 0.5;
                            });
                        }
                    };
                }
            },
            {
                title: "8. Mohamed’s Legacy (The Mirja)",
                desc: "Revered as a spiritual Mirja leader, Mohamed stands upon a golden dais while a massive crowd of followers bow and honor his enduring legacy.",
                camPos: [0, 14, 34],
                camLookAt: [0, 4, 0],
                skyColor: 0xfffae6,
                setup: () => {
                    worldGround.material.color.setHex(0x52b788);
                    scene.fog.color.setHex(0xfffae6);
                    const props = [];

                    const dais = new THREE.Mesh(new THREE.CylinderGeometry(7, 8, 2.5, 20), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 }));
                    dais.position.set(0, 1.25, -2);
                    scene.add(dais);
                    props.push(dais);

                    const auraLight = new THREE.PointLight(0xffd700, 6, 35);
                    auraLight.position.set(0, 6, -2);
                    scene.add(auraLight);
                    props.push(auraLight);

                    const mohamed = createRobloxR6({ shirtColor: 0xffffff, legColor: 0xffffff, headColor: 0xf5cd2f, accessoryType: 'crown' });
                    mohamed.position.set(0, 2.5, -2);
                    scene.add(mohamed);
                    props.push(mohamed);

                    // Large crowd of 16 followers obeying & bowing
                    for (let x = -14; x <= 14; x += 4) {
                        for (let z = 4; z <= 12; z += 4) {
                            const follower = createRobloxR6({ shirtColor: 0x74c69d, legColor: 0x1b4332 });
                            follower.position.set(x + (Math.random() - 0.5), 0, z);
                            scene.add(follower);
                            props.push(follower);
                        }
                    }

                    let time = 0;
                    return {
                        actors: props,
                        update: () => {
                            time += 0.03;
                            auraLight.intensity = 4 + Math.sin(time * 3) * 2;
                            mohamed.rig.leftArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(time * 2) * 0.1;
                            mohamed.rig.rightArmGroup.rotation.x = -Math.PI / 2.2 + Math.sin(time * 2) * 0.1;
                        }
                    };
                }
            }
        ];

        let currentSceneIndex = 0;
        let activeSceneInstance = null;
        let autoPlay = true;
        let sceneStartTime = Date.now();

        function clearCurrentScene() {
            if (activeSceneInstance && activeSceneInstance.actors) {
                activeSceneInstance.actors.forEach(actor => scene.remove(actor));
            }
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const child = scene.children[i];
                if (child !== worldGround && child !== sun && child !== ambientLight) {
                    scene.remove(child);
                }
            }
        }

        function loadScene(index) {
            clearCurrentScene();
            currentSceneIndex = index;
            sceneStartTime = Date.now();

            const data = storyData[index];
            document.getElementById('scene-title').innerText = data.title;
            document.getElementById('scene-description').innerText = data.desc;
            document.getElementById('scene-counter').innerText = `SCENE ${index + 1} / ${storyData.length}`;

            camera.position.set(...data.camPos);
            camera.lookAt(...data.camLookAt);

            activeSceneInstance = data.setup();
        }

        function nextScene() {
            loadScene((currentSceneIndex + 1) % storyData.length);
        }

        function prevScene() {
            loadScene((currentSceneIndex - 1 + storyData.length) % storyData.length);
        }

        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            document.getElementById('autoplay-btn').innerText = `Autoplay: ${autoPlay ? 'ON' : 'OFF'}`;
            sceneStartTime = Date.now();
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - sceneStartTime;
            if (autoPlay) {
                const progress = Math.min((elapsed / SCENE_DURATION_MS) * 100, 100);
                document.getElementById('progress-bar').style.width = `${progress}%`;

                if (elapsed >= SCENE_DURATION_MS) {
                    nextScene();
                }
            } else {
                document.getElementById('progress-bar').style.width = `0%`;
            }

            if (activeSceneInstance && activeSceneInstance.update) {
                activeSceneInstance.update();
            }

            renderer.render(scene, camera);
        }

        loadScene(0);
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
